    <!-- Outer orange curve / G arc -->
    <path d="M 68 18 C 36 18 16 38 16 64 C 16 90 38 106 68 106 C 94 106 108 92 110 74 L 68 74 L 68 56 L 126 56 C 128 88 106 118 68 118 C 28 118 2 92 2 64 C 2 34 28 4 68 4 C 84 4 99 9 110 18 L 96 32 C 88 23 79 18 68 18 Z" fill="#F26A21" />
    
